[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safeact"
version = "0.2.0"
description = "Security layer for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.1",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.2"
]

[tool.setuptools]
packages = ["safeact"]